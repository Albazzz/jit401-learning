<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIT401 Pro - Nền tảng học IT Nhật Bản</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAFC;
    --card: #FFFFFF;
    --primary: #4F7CFF;
    --primary-hover: #3D6AEC;
    --primary-light: #EAF1FF;
    --success: #34C759;
    --warning: #FFB020;
    --error: #FF5A5F;
    --text-main: #222222;
    --text-sub: #666666;
    --border: #E8EAF0;
    --hover: #F4F7FF;
    --radius-lg: 18px;
    --radius-md: 12px;
    --shadow: 0 4px 12px rgba(0,0,0,0.03);
    --sidebar-w: 280px;
    --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* --- LAYOUT --- */
  .app-container { display: flex; min-height: 100vh; }

  /* --- SIDEBAR --- */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--card);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 32px 0;
    display: flex;
    flex-direction: column;
    z-index: 100;
  }
  .logo-area { padding: 0 24px 40px; font-weight: 800; font-size: 22px; color: var(--primary); display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 36px; height: 36px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 20px; }

  .nav-section { padding: 0 12px; flex: 1; overflow-y: auto; }
  .nav-label { font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; padding: 0 12px 16px; opacity: 0.6; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    color: var(--text-sub);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    margin-bottom: 4px;
  }
  .nav-item:hover { background: var(--hover); color: var(--primary); transform: translateX(4px); }
  .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .ch-num-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.5; width: 24px; }

  /* --- MAIN CONTENT --- */
  .main-content { flex: 1; padding: 60px 48px; max-width: 1200px; margin: 0 auto; }
  .view-tab { display: none; animation: slideUp 400ms ease; }
  .view-tab.active { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* --- TOP TABS --- */
  .top-nav { display: flex; gap: 32px; margin-bottom: 48px; border-bottom: 2px solid var(--border); }
  .top-tab-btn { padding: 16px 4px; font-size: 15px; font-weight: 600; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; transition: var(--transition); position: relative; bottom: -2px; }
  .top-tab-btn:hover { color: var(--primary); }
  .top-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* --- CHAPTER HEADER --- */
  .ch-header { margin-bottom: 56px; }
  .ch-meta { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .badge { padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: var(--card); color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
  .badge.primary { background: var(--primary); color: white; border-color: var(--primary); }
  .badge.success { background: #E6F7ED; color: var(--success); border-color: #D0F0E4; }

  .ch-title-jp { font-size: 42px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
  .ch-title-vn { font-size: 24px; color: var(--text-sub); font-weight: 500; }

  /* --- KNOWLEDGE CARDS --- */
  .k-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: var(--transition);
  }
  .k-card:hover { border-color: var(--primary); box-shadow: 0 8px 24px rgba(79,124,255,0.08); }

  .k-card-head { padding: 24px 32px; cursor: pointer; display: flex; align-items: center; gap: 24px; user-select: none; }
  .k-icon-box { font-size: 24px; width: 56px; height: 56px; background: var(--bg); display: flex; align-items: center; justify-content: center; border-radius: 16px; transition: var(--transition); }
  .k-card:hover .k-icon-box { background: var(--primary-light); transform: scale(1.05); }

  .k-title-box { flex: 1; }
  .k-jp { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  .k-yomi { font-size: 13px; color: var(--primary); font-family: 'JetBrains Mono', monospace; font-weight: 500; background: var(--primary-light); padding: 2px 8px; border-radius: 6px; }
  .k-vn-term { display: block; font-size: 15px; color: var(--text-sub); margin-top: 4px; font-weight: 500; }

  .arrow { font-size: 14px; transition: 400ms cubic-bezier(0.4, 0, 0.2, 1); color: var(--text-sub); opacity: 0.4; }
  .k-card.open .arrow { transform: rotate(180deg); opacity: 1; }

  .k-card-body { display: none; padding: 8px 32px 32px; border-top: 1px solid var(--border); background: #FCFCFD; }
  .k-card.open .k-card-body { display: block; }

  /* --- INFO BOXES --- */
  .section-divider { margin: 32px 0 16px; height: 1px; background: var(--border); position: relative; }
  .section-divider::before { content: attr(data-label); position: absolute; top: -10px; left: 0; background: #FCFCFD; padding-right: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #BBBECB; }

  .info-box { padding: 20px 24px; border-radius: var(--radius-md); margin-top: 16px; font-size: 15px; display: flex; gap: 16px; align-items: flex-start; }
  .info-box.blue { background: #F0F5FF; border: 1px solid #D9E4FF; }
  .info-box.yellow { background: #FFF9E6; border: 1px solid #FFEBB3; }
  .info-box.green { background: #E6FFFA; border: 1px solid #B2F5EA; }

  .box-label { font-weight: 700; display: block; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .box-icon { font-size: 18px; margin-top: 2px; }

  /* --- QUIZ --- */
  .quiz-container { max-width: 800px; margin: 0 auto; }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 48px; box-shadow: 0 20px 40px rgba(0,0,0,0.04); position: relative; }
  .q-count { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .q-text { font-size: 26px; font-weight: 700; margin-bottom: 40px; line-height: 1.4; }

  .options-stack { display: grid; gap: 14px; }
  .opt-btn {
    background: var(--card);
    border: 2px solid var(--border);
    padding: 20px 28px;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-size: 17px;
    font-weight: 600;
    transition: 150ms ease;
    display: flex;
    align-items: center;
    gap: 20px;
    text-align: left;
  }
  .opt-btn:hover:not(.locked) { border-color: var(--primary); background: var(--hover); transform: translateY(-2px); }
  .opt-btn.correct { background: #E6F7ED; border-color: var(--success); color: #0E733B; }
  .opt-btn.wrong { background: #FFF5F5; border-color: var(--error); color: #B3261E; }
  .opt-idx { width: 36px; height: 36px; background: var(--bg); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: var(--text-sub); transition: var(--transition); }
  .opt-btn.correct .opt-idx { background: var(--success); color: white; }
  .opt-btn.wrong .opt-idx { background: var(--error); color: white; }

  .ans-feedback { margin-top: 32px; padding: 24px; border-radius: var(--radius-md); display: none; animation: fadeIn 300ms ease; }
  .ans-feedback.show { display: block; }
  .ans-feedback.correct { background: #F0FAF0; border: 1px solid #D0E7D0; color: #0E733B; }
  .ans-feedback.wrong { background: #FFF9F9; border: 1px solid #FFE0E0; color: #B3261E; }

  .progress-wrap { width: 100%; height: 10px; background: var(--border); border-radius: 99px; margin-bottom: 40px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: 600ms cubic-bezier(0.34, 1.56, 0.64, 1); }

  /* --- RESPONSIVE --- */
  @media (max-width: 1024px) {
    .sidebar { width: 80px; }
    .logo-area span:last-child, .nav-item span:last-child, .nav-label { display: none; }
    .logo-area { padding: 0 0 40px; justify-content: center; }
    .nav-item { justify-content: center; padding: 14px; }
    .main-content { padding: 40px 24px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo-icon">J</div>
      <span>JIT401 Pro</span>
    </div>

    <div class="nav-section">
      <div class="nav-label">Chương trình học</div>
      <div id="sidebar-nav"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="content main-content">
    <div class="top-nav">
      <div id="tab-btn-study" class="top-tab-btn active" onclick="switchMainTab('study')">📚 Bài học</div>
      <div id="tab-btn-quiz" class="top-tab-btn" onclick="switchMainTab('quiz')">✏️ Luyện tập</div>
      <div id="tab-btn-flashcard" class="top-tab-btn" onclick="switchMainTab('flashcard')">🎴 Flashcards</div>
    </div>

    <!-- STUDY VIEW -->
    <div id="view-study" class="view-tab active">
      <div id="lesson-content"></div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="view-quiz" class="view-tab">
      <div class="quiz-container">
        <div class="progress-wrap"><div id="quiz-prog" class="progress-bar"></div></div>
        <div id="quiz-area">
          <div class="q-card" style="text-align:center">
            <h2 style="margin-bottom:16px; font-size:28px">Sẵn sàng ôn tập?</h2>
            <p style="color:var(--text-sub);margin-bottom:32px">Chọn phạm vi kiến thức bạn muốn kiểm tra.</p>
            <div style="display:flex;gap:12px;justify-content:center;flex-direction:column;max-width:300px;margin:0 auto">
              <select id="quiz-selector" style="padding:14px;border-radius:12px;border:1.5px solid var(--border);outline:none;font-weight:600;font-size:15px;background:white">
                <option value="all">Tất cả 16 chương</option>
              </select>
              <button class="badge primary" style="padding:16px;cursor:pointer;justify-content:center;font-size:15px" onclick="startQuiz()">Bắt đầu Quiz</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="view-flashcard" class="view-tab">
      <div style="text-align:center;padding:120px 0;">
        <div style="font-size:64px;margin-bottom:24px">🏗️</div>
        <h3 style="font-size:24px;margin-bottom:12px">Tính năng Flashcards</h3>
        <p style="color:var(--text-sub)">Chế độ lật thẻ 3D đang được hoàn thiện. Hãy quay lại sau nhé!</p>
        <button class="badge primary" style="margin:32px auto;cursor:pointer" onclick="switchMainTab('study')">Quay lại học bài</button>
      </div>
    </div>
  </main>
</div>

    vn: "Hệ điều hành",
    vnSummary: "Vai trò trung gian của OS, quản lý đa nhiệm và bộ nhớ ảo.",
    time: "20 min", difficulty: "Trung bình",
    concepts: [
      { term: "カーネル (Kernel)", yomi: "かーねる", vnTerm: "Nhân hệ điều hành", icon: "🐚",
        desc: "OS の核心部分。ハードウェアを直接管理します。",
        vnDesc: "Bộ phận quan trọng nhất, đứng ra điều phối toàn bộ linh kiện phần cứng.",
        rem: "カーネルを補助する周辺プログラムをユーティリティと呼びます。",
        vnRem: "Kernel là bộ não, Utilities là các công cụ trợ giúp của Hệ điều hành."
      },
      { term: "マルチタスク", yomi: "まるちたすく", vnTerm: "Đa nhiệm", icon: "⏳",
        desc: "複数のプログラムを同時に実行しているように見せる機能。",
        vnDesc: "OS chia nhỏ thời gian CPU cho từng app, khiến bạn cảm thấy máy đang chạy nhiều việc cùng lúc.",
        rem: "CPU の使用時間を各プログラムに割り当てて管理します。",
        vnRem: "Thực chất CPU chỉ làm 1 việc tại 1 thời điểm, nhưng nó đổi việc quá nhanh!"
      }
    ],
    types: ["Chức năng: Quản lý File, Task, Memory, Device, User", "Hệ máy: Windows, UNIX, Linux (Mã nguồn mở), macOS, Android"]
  }
];

const allQuestions = [
  { ch:1, q:"Trong kiến trúc Von Neumann, chương trình được lưu trữ ở đâu?", opts:["Trong CPU","Trong Bộ nhớ (Memory)","Trong Chuột","Không cần lưu trữ"], ans:1, exp:"Kiến trúc Von Neumann đưa chương trình vào bộ nhớ giống như dữ liệu để xử lý linh hoạt." },
  { ch:2, q:"Quy luật nào giải thích việc bán nhiều mặt hàng kén khách mang lại lợi nhuận lớn?", opts:["Quy luật 80/20","Quy luật Cái đuôi dài (Long Tail)","Quy luật Murphy","Quy luật Cung cầu"], ans:1, exp:"Long Tail tận dụng không gian vô hạn của Internet để bán các sản phẩm ngách." },
  { ch:3, q:"Loại màn hình nào không cần đèn nền (backlight) vì các điểm ảnh tự phát sáng?", opts:["Màn hình LCD","Màn hình OLED (EL hữu cơ)","Màn hình CRT","Màn hình LED TV"], ans:1, exp:"OLED sử dụng vật liệu hữu cơ tự phát sáng khi có điện." },
  { ch:4, q:"Công nghệ nào dùng ngay ổ cắm điện trong nhà để kết nối mạng?", opts:["ADSL","PLC (Đường điện)","FTTH (Cáp quang)","Wi-Fi"], ans:1, exp:"PLC (Power Line Communication) truyền tín hiệu qua dây điện 100V." },
  { ch:5, q:"Mô hình mạng nào có Hub nằm ở trung tâm?", opts:["Kiểu Bus","Kiểu Star (Hình sao)","Kiểu Ring","Kiểu Mesh"], ans:1, exp:"Kiểu Star là mô hình phổ biến nhất hiện nay, mọi máy nối về Hub/Switch trung tâm." },
  { ch:6, q:"Địa chỉ IPv6 có độ dài bao nhiêu bit?", opts:["32 bit","64 bit","128 bit","256 bit"], ans:2, exp:"IPv6 mở rộng lên 128 bit để giải quyết vấn đề cạn kiệt địa chỉ của IPv4 (32 bit)." },
  { ch:12, q:"Dịch bit sang trái 3 lần tương đương với phép toán nào?", opts:["Cộng thêm 3","Nhân với 3","Nhân với 8 (2^3)","Chia cho 8"], ans:2, exp:"Mỗi lần dịch trái là nhân 2. Dịch 3 lần là 2x2x2 = 8." },
  { ch:13, q:"Một ký tự tiếng Nhật (Kanji/Kana) thường tốn bao nhiêu dung lượng bộ nhớ?", opts:["1 bit","1 byte","2 byte (16 bit)","4 byte"], ans:2, exp:"Do số lượng ký tự lớn, tiếng Nhật cần 2 byte, trong khi Alphabet chỉ cần 1 byte." },
  { ch:15, q:"Kỹ thuật kiểm tra chẵn lẻ (Parity check) có thể sửa được tối đa bao nhiêu lỗi bit?", opts:["0 lỗi (chỉ phát hiện)","1 lỗi duy nhất","2 lỗi","Không giới hạn"], ans:1, exp:"Parity check cơ bản chỉ phát hiện được lỗi, nếu kết hợp khối có thể sửa được tối đa 1 lỗi." }
];

// ================================================================
//  LOGIC XỬ LÝ GIAO DIỆN
// ================================================================
let currentChapterNum = 1;
let quizPool = [];
let currentQIdx = 0;
let quizScore = 0;

function init() {
  const nav = document.getElementById('sidebar-nav');
  const sel = document.getElementById('quiz-selector');

  chapters.forEach(ch => {
    // Sidebar
    const item = document.createElement('div');
    item.className = `nav-item ${ch.num === 1 ? 'active' : ''}`;
    item.id = `nav-ch-${ch.num}`;
    item.onclick = () => renderChapter(ch.num);
    item.innerHTML = `<span class="ch-num-badge">${String(ch.num).padStart(2,'0')}</span> <span>${ch.title}</span>`;
    nav.appendChild(item);

    // Quiz Selection
    const opt = document.createElement('option');
    opt.value = ch.num;
    opt.textContent = `Chương ${ch.num}: ${ch.title}`;
    sel.appendChild(opt);
  });

  renderChapter(1);
}

function switchMainTab(tab) {
  document.querySelectorAll('.view-tab').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.remove('active'));

  document.getElementById(`view-${tab}`).classList.add('active');
  document.getElementById(`tab-btn-${tab}`).classList.add('active');
  window.scrollTo(0,0);
}

function renderChapter(num) {
  currentChapterNum = num;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.getElementById(`nav-ch-${num}`).classList.add('active');
  switchMainTab('study');

  const ch = chapters.find(c => c.num === num);
  const content = document.getElementById('lesson-content');

  const cardsHtml = ch.concepts.length > 0 ? ch.concepts.map((con, idx) => `
    <div class="k-card" id="k-card-${idx}">
      <div class="k-card-head" onclick="toggleCard(${idx})">
        <div class="k-icon-box">${con.icon || '📘'}</div>
        <div class="k-title-box">
          <div class="k-jp">${con.term} <span class="k-yomi">${con.yomi}</span></div>
          <span class="k-vn-term">${con.vnTerm}</span>
        </div>
        <div class="arrow">↓</div>
      </div>
      <div class="k-card-body">
        <div class="section-divider" data-label="📖 Khái niệm"></div>
        <div class="info-box blue">
          <div class="box-icon">💡</div>
          <div>
            <p><strong>${con.desc}</strong></p>
            <p style="margin-top:8px; color:var(--text-sub)">${con.vnDesc}</p>
          </div>
        </div>

        <div class="section-divider" data-label="🎯 Mẹo ghi nhớ"></div>
        <div class="info-box green">
          <div class="box-icon">✅</div>
          <div>
            <p>${con.rem}</p>
            <p style="margin-top:8px; color:var(--text-sub)"><em>${con.vnRem}</em></p>
          </div>
        </div>
      </div>
    </div>
  `).join('') : '<p style="text-align:center;padding:40px;color:var(--text-sub)">Dữ liệu chi tiết đang được đồng bộ. Hãy quay lại sau!</p>';

  const typesHtml = ch.types.length > 0 ? ch.types.map(t => `
    <div style="padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px">
      <div style="width:6px;height:6px;background:var(--primary);border-radius:99px"></div>
      <span style="font-weight:500; font-size:14px">${t}</span>
    </div>
  `).join('') : '';

  content.innerHTML = `
    <div class="ch-header">
      <div class="ch-meta">
        <div class="badge primary">Chương ${ch.num}</div>
        <div class="badge">🕒 ${ch.time || '--'}</div>
        <div class="badge success">📊 ${ch.difficulty || '--'}</div>
      </div>
      <h1 class="ch-title-jp">${ch.title}</h1>
      <div class="ch-title-vn">${ch.vn}</div>
    </div>

    <div class="info-box" style="background:#F4F7FF; margin-bottom:56px; border:none; padding:28px">
       <div style="font-size:20px;margin-right:8px">📝</div>
       <p style="font-size:16px; font-weight:500; color:#4056A1"><strong>Tóm tắt cốt lõi:</strong> ${ch.vnSummary || 'Đang cập nhật tóm tắt...'}</p>
    </div>

    <div class="nav-label" style="padding-left:0; margin-bottom:24px">Kiến thức trọng tâm</div>
    ${cardsHtml}

    ${ch.types.length > 0 ? `
      <div class="nav-label" style="padding-left:0; margin:56px 0 24px">Phân loại & Hệ thống</div>
      <div class="k-card" style="padding:8px 0">${typesHtml}</div>
    ` : ''}

    <div style="margin-top:64px; text-align:center">
      <button class="badge primary" style="margin:0 auto; padding:16px 32px; cursor:pointer; font-size:15px" onclick="startQuizForThisChapter()">Làm Quiz Chương ${ch.num} →</button>
    </div>
  `;
}

function toggleCard(idx) {
  document.getElementById(`k-card-${idx}`).classList.toggle('open');
}

// QUIZ LOGIC
function startQuizForThisChapter() {
  document.getElementById('quiz-selector').value = currentChapterNum;
  switchMainTab('quiz');
  startQuiz();
}

function startQuiz() {
  const val = document.getElementById('quiz-selector').value;
  quizPool = val === 'all' ? allQuestions : allQuestions.filter(q => q.ch == val);

  if(quizPool.length === 0) {
    alert("Chưa có câu hỏi cho chương này. Hãy thử 'Tất cả 16 chương'.");
    return;
  }

  quizPool = [...quizPool].sort(() => Math.random() - 0.5);
  currentQIdx = 0;
  quizScore = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = quizPool[currentQIdx];
  const area = document.getElementById('quiz-area');
  document.getElementById('quiz-prog').style.width = `${(currentQIdx / quizPool.length) * 100}%`;

  const labels = ['A','B','C','D'];
  area.innerHTML = `
    <div class="q-card">
      <div class="q-count">Câu hỏi ${currentQIdx + 1} / ${quizPool.length}</div>
      <h2 class="q-text">${q.q}</h2>

      <div class="options-stack">
        ${q.opts.map((o, i) => `
          <div class="opt-btn" id="opt-${i}" onclick="checkAnswer(${i})">
            <div class="opt-idx">${labels[i]}</div>
            <span>${o}</span>
          </div>
        `).join('')}
      </div>

      <div id="quiz-feedback" class="ans-feedback"></div>

      <div style="margin-top:40px; display:flex; justify-content:center">
        <button id="next-q-btn" class="badge primary" style="display:none; padding:14px 48px; cursor:pointer; font-size:15px" onclick="nextQuestion()">Tiếp tục →</button>
      </div>
    </div>
  `;
}

function checkAnswer(idx) {
  const q = quizPool[currentQIdx];
  if(document.getElementById('next-q-btn').style.display === 'block') return;

  const feedback = document.getElementById('quiz-feedback');
  const isCorrect = idx === q.ans;

  if(isCorrect) {
    quizScore++;
    document.getElementById(`opt-${idx}`).classList.add('correct');
    feedback.innerHTML = `<span class="box-label">✨ Chính xác!</span><p>${q.exp}</p>`;
    feedback.className = "ans-feedback show correct";
  } else {
    document.getElementById(`opt-${idx}`).classList.add('wrong');
    document.getElementById(`opt-${q.ans}`).classList.add('correct');
    feedback.innerHTML = `<span class="box-label">❌ Chưa đúng</span><p>${q.exp}</p>`;
    feedback.className = "ans-feedback show wrong";
  }

  document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('locked'));
  document.getElementById('next-q-btn').style.display = 'block';
}

function nextQuestion() {
  currentQIdx++;
  if(currentQIdx < quizPool.length) {
    renderQuestion();
  } else {
    showQuizResult();
  }
}

function showQuizResult() {
  const pct = Math.round((quizScore / quizPool.length) * 100);
  document.getElementById('quiz-prog').style.width = '100%';
  document.getElementById('quiz-area').innerHTML = `
    <div class="q-card" style="text-align:center">
      <div style="font-size:72px; margin-bottom:24px">${pct >= 80 ? '🥳' : '📚'}</div>
      <h2 style="font-size:32px; margin-bottom:8px">Kết quả của bạn</h2>
      <p style="font-size:56px; font-weight:900; color:var(--primary); margin:16px 0">${quizScore} / ${quizPool.length}</p>
      <p style="color:var(--text-sub); font-size:18px">Độ chính xác: ${pct}%</p>
      <div style="display:flex; gap:12px; justify-content:center; margin-top:40px">
        <button class="badge primary" style="padding:16px 32px; cursor:pointer" onclick="startQuiz()">Làm lại Quiz</button>
        <button class="badge" style="padding:16px 32px; cursor:pointer" onclick="switchMainTab('study')">Về trang học bài</button>
      </div>
    </div>
  `;
}

init();
</script>
</body>
</html>
