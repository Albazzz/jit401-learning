<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIT401 - Modern Learning Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAFC;
    --card: #FFFFFF;
    --primary: #4F7CFF;
    --primary-light: #EAF1FF;
    --success: #34C759;
    --warning: #FFB020;
    --error: #FF5A5F;
    --text-main: #222222;
    --text-sub: #666666;
    --border: #E8EAF0;
    --hover: #F4F7FF;
    --radius: 16px;
    --shadow: 0 4px 12px rgba(0,0,0,0.03);
    --sidebar-w: 280px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* LAYOUT */
  .app-container { display: flex; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--card);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    z-index: 100;
  }
  .logo-area { padding: 0 24px 32px; font-weight: 700; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .nav-section { padding: 0 12px; flex: 1; overflow-y: auto; }
  .nav-label { font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; padding: 0 12px 12px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    color: var(--text-sub);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: 0.2s;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--hover); color: var(--primary); }
  .nav-item.active { background: var(--primary-light); color: var(--primary); position: relative; }
  .nav-item.active::before { content:''; position:absolute; left:-12px; width:4px; height:20px; background:var(--primary); border-radius:0 4px 4px 0; }
  .ch-num { font-family: monospace; font-size: 12px; opacity: 0.6; }

  /* MAIN CONTENT */
  .main-content { flex: 1; padding: 48px; max-width: 1100px; margin: 0 auto; }
  .view-tab { display: none; animation: fadeIn 0.3s ease; }
  .view-tab.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* HEADER */
  .ch-header { margin-bottom: 40px; }
  .ch-badge-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .badge { padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--card); }
  .badge.primary { background: var(--primary); color: white; border-color: var(--primary); }
  .ch-header h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
  .ch-header .subtitle { color: var(--text-sub); font-size: 18px; }

  /* KNOWLEDGE CARDS */
  .k-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: 0.2s;
  }
  .k-card-head {
    padding: 20px 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    user-select: none;
  }
  .k-card-head:hover { background: var(--bg); }
  .k-icon { font-size: 20px; width: 40px; height: 40px; background: var(--bg); display: flex; align-items: center; justify-content: center; border-radius: 12px; }
  .k-title-box { flex: 1; }
  .k-jp { font-size: 18px; font-weight: 600; }
  .k-yomi { font-size: 12px; color: var(--primary); margin-left: 8px; font-family: monospace; }
  .k-vn-term { display: block; font-size: 13px; color: var(--text-sub); margin-top: 2px; }
  .arrow { font-size: 12px; transition: 0.3s; color: var(--text-sub); }
  .k-card.open .arrow { transform: rotate(180deg); }

  .k-card-body {
    display: none;
    padding: 0 24px 24px;
    border-top: 1px solid var(--border);
    background: #FFFFFF;
  }
  .k-card.open .k-card-body { display: block; }

  .info-box { padding: 16px; border-radius: 12px; margin-top: 16px; font-size: 14px; display: flex; gap: 12px; }
  .info-box.blue { background: #F0F5FF; border-left: 4px solid #4F7CFF; }
  .info-box.yellow { background: #FFF9E6; border-left: 4px solid #FFB020; }
  .info-box.green { background: #E6FFFA; border-left: 4px solid #34C759; }
  .box-label { font-weight: 700; display: block; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; }

  /* QUIZ */
  .quiz-wrap { max-width: 800px; margin: 0 auto; }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
  .options-grid { display: grid; gap: 16px; margin-top: 32px; }
  .opt-btn {
    background: var(--card);
    border: 2px solid var(--border);
    padding: 18px 24px;
    border-radius: 16px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .opt-btn:hover:not(.locked) { border-color: var(--primary); background: var(--hover); }
  .opt-btn.correct { background: #E6FFFA; border-color: var(--success); color: #006644; }
  .opt-btn.wrong { background: #FFF5F5; border-color: var(--error); color: #990000; }
  .opt-idx { width: 32px; height: 32px; background: var(--bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text-sub); }
  .opt-btn.correct .opt-idx { background: var(--success); color: white; }
  .opt-btn.wrong .opt-idx { background: var(--error); color: white; }

  .ans-feedback { margin-top: 24px; padding: 24px; border-radius: 16px; display: none; }
  .ans-feedback.show { display: block; }
  .ans-feedback.correct { background: #E6FFFA; color: #006644; }
  .ans-feedback.wrong { background: #FFF5F5; color: #990000; }

  .prog-container { width: 100%; height: 8px; background: var(--border); border-radius: 99px; margin-bottom: 32px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }

  /* TOP BAR */
  .top-tabs { display: flex; gap: 32px; margin-bottom: 32px; border-bottom: 1px solid var(--border); }
  .top-tab-btn { padding: 12px 4px; font-size: 15px; font-weight: 600; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; }
  .top-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .sidebar { width: 80px; }
    .logo-area span, .nav-item span:last-child, .nav-label { display: none; }
    .main-content { padding: 24px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo-area">
      <span>📘</span>
      <span>JIT401</span>
    </div>

    <div class="nav-section">
      <div class="nav-label">Chương trình học</div>
      <div id="sidebar-nav"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="content main-content">
    <div class="top-tabs">
      <div class="top-tab-btn active" onclick="switchMainTab('study')">📚 Bài học</div>
      <div class="top-tab-btn" onclick="switchMainTab('quiz')">✏️ Luyện tập</div>
      <div class="top-tab-btn" onclick="switchMainTab('flashcard')">🎴 Thẻ từ</div>
    </div>

    <!-- STUDY VIEW -->
    <div id="view-study" class="view-tab active">
      <div id="lesson-content">
        <!-- Chapter content rendered here -->
      </div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="view-quiz" class="view-tab">
      <div class="quiz-wrap">
        <div class="prog-container"><div id="quiz-prog" class="prog-fill"></div></div>
        <div id="quiz-area">
          <div class="q-card" style="text-align:center">
            <h2 style="margin-bottom:16px">Sẵn sàng ôn tập?</h2>
            <p style="color:var(--text-sub);margin-bottom:24px">Chọn chương hoặc ôn tập tất cả các chương đã học.</p>
            <div style="display:flex;gap:12px;justify-content:center">
              <select id="quiz-selector" style="padding:12px;border-radius:12px;border:1px solid var(--border);outline:none">
                <option value="all">Tất cả chương</option>
              </select>
              <button class="badge primary" style="padding:0 24px;cursor:pointer" onclick="startQuiz()">Bắt đầu</button>
            </div>
          </div>
        </div>
        <div id="quiz-result" style="display:none"></div>
      </div>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="view-flashcard" class="view-tab">
      <div style="text-align:center;padding:100px 0;">
        <h3>Tính năng Flashcard đang phát triển...</h3>
        <p style="color:var(--text-sub)">Sẽ sớm ra mắt với hiệu ứng lật thẻ 3D.</p>
      </div>
    </div>
  </main>
</div>

  { "ch": 15, "q": "Định dạng video nào kết hợp nén ảnh tĩnh với ghi sai khác (chỉ ghi phần thay đổi giữa các khung hình)?", "opts": ["GIF", "JPEG", "MPEG", "ASCII"], "ans": 2, "exp": "MPEG (Motion Picture Expert Group) kết hợp nén ảnh tĩnh với kỹ thuật ghi sai khác (differential recording) để nén video hiệu quả." },
  { "ch": 16, "q": "Hệ điều hành nào đóng vai trò 'phần mềm cơ bản', là trung gian giữa phần mềm ứng dụng và phần cứng?", "opts": ["Driver", "OS (hệ điều hành)", "Middleware", "BIOS"], "ans": 1, "exp": "OS (hệ điều hành) là phần mềm hệ thống đóng vai trò trung gian giữa ứng dụng và phần cứng, nên còn gọi là 'phần mềm cơ bản'." },
  { "ch": 16, "q": "Khả năng quản lý để nhiều chương trình chạy đồng thời trên một máy tính gọi là gì?", "opts": ["Multiuser (đa người dùng)", "Multitasking (đa nhiệm)", "Virtual memory (bộ nhớ ảo)", "Swapping"], "ans": 1, "exp": "Multitasking (đa nhiệm) là khả năng OS quản lý để nhiều tiến trình/chương trình hoạt động như đồng thời." },
  { "ch": 16, "q": "Hệ điều hành mã nguồn mở Linux được phát triển dựa trên tinh thần và kỹ thuật của hệ điều hành nào?", "opts": ["Windows", "MacOS", "UNIX", "MS-DOS"], "ans": 2, "exp": "Linux do Linus Torvalds (Phần Lan) phát triển, kế thừa tinh thần mở và kỹ thuật của UNIX." }
];

// ================================================================
//  LOGIC
// ================================================================
let currentChapterNum = 1;
let quizPool = [];
let currentQIdx = 0;
let quizScore = 0;

function init() {
  const sidebar = document.getElementById('sidebar-nav');
  const quizSel = document.getElementById('quiz-selector');

  chapters.forEach(ch => {
    const item = document.createElement('div');
    item.className = `nav-item ${ch.num === currentChapterNum ? 'active' : ''}`;
    item.id = `nav-ch-${ch.num}`;
    item.onclick = () => renderChapter(ch.num);
    item.innerHTML = `<span class="ch-num">${String(ch.num).padStart(2,'0')}</span> <span>${ch.title}</span>`;
    sidebar.appendChild(item);

    const opt = document.createElement('option');
    opt.value = ch.num;
    opt.textContent = `Chương ${ch.num}: ${ch.title}`;
    quizSel.appendChild(opt);
  });

  renderChapter(1);
}

function switchMainTab(tab) {
  document.querySelectorAll('.view-tab').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`view-${tab}`).classList.add('active');
  event.currentTarget.classList.add('active');
}

function renderChapter(num) {
  currentChapterNum = num;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.getElementById(`nav-ch-${num}`).classList.add('active');

  const ch = chapters.find(c => c.num === num);
  const content = document.getElementById('lesson-content');

  const cardsHtml = ch.concepts.map((con, idx) => `
    <div class="k-card" id="k-card-${idx}">
      <div class="k-card-head" onclick="toggleCard(${idx})">
        <div class="k-icon">${con.icon || '📖'}</div>
        <div class="k-title-box">
          <span class="k-jp">${con.term}</span> <span class="k-yomi">${con.yomi}</span>
          <span class="k-vn-term">${con.vnTerm}</span>
        </div>
        <div class="arrow">▼</div>
      </div>
      <div class="k-card-body">
        <div class="info-box blue">
          <div><span class="box-label">📖 Khái niệm</span><p>${con.desc}</p><p style="margin-top:8px; color:var(--text-sub)">${con.vnDesc}</p></div>
        </div>
        <div class="info-box green">
          <div><span class="box-label">💡 Ghi nhớ</span><p>${con.rem || (con.term + ' là kiến thức trọng tâm của chương này.')}</p><p style="margin-top:8px; color:var(--text-sub)">${con.vnRem || 'Hãy xem kỹ phần giải thích phía trên để nắm vững bản chất.'}</p></div>
        </div>
      </div>
    </div>
  `).join('');

  const typesHtml = ch.types.map((t, i) => `
    <div style="padding:12px 16px; border-bottom:1px solid var(--border)">
      <div style="font-weight:600">${t}</div>
      <div style="font-size:13px; color:var(--text-sub)">${ch.vnTypes[i]}</div>
    </div>
  `).join('');

  content.innerHTML = `
    <div class="ch-header">
      <div class="ch-badge-row">
        <div class="badge primary">Chương ${ch.num}</div>
        <div class="badge">🕒 ${ch.time}</div>
        <div class="badge">📊 ${ch.difficulty}</div>
      </div>
      <h1>${ch.title}</h1>
      <div class="subtitle">${ch.vn}</div>
    </div>
    <div class="info-box" style="background:#F4F7FF; margin-bottom:32px"><p><strong>Tóm tắt:</strong> ${ch.vnSummary}</p></div>
    <div class="nav-label" style="padding-left:0">Kiến thức trọng tâm</div>
    ${cardsHtml}
    <div class="nav-label" style="padding-left:0; margin-top:40px">Phân loại</div>
    <div class="k-card">${typesHtml}</div>
  `;
  window.scrollTo(0,0);
}

function toggleCard(idx) { document.getElementById(`k-card-${idx}`).classList.toggle('open'); }

function startQuiz() {
  const chVal = document.getElementById('quiz-selector').value;
  quizPool = chVal === 'all' ? allQuestions : allQuestions.filter(q => q.ch == chVal);
  if(quizPool.length === 0) { alert("Chưa có câu hỏi cho chương này."); return; }
  quizPool = [...quizPool].sort(() => Math.random() - 0.5);
  currentQIdx = 0; quizScore = 0; renderQuestion();
}

function renderQuestion() {
  const q = quizPool[currentQIdx];
  const area = document.getElementById('quiz-area');
  const prog = document.getElementById('quiz-prog');
  prog.style.width = `${(currentQIdx / quizPool.length) * 100}%`;
  const labels = ['A','B','C','D'];
  area.innerHTML = `
    <div class="q-card">
      <div style="font-size:12px; color:var(--text-sub); margin-bottom:8px">CÂU HỎI ${currentQIdx + 1} / ${quizPool.length}</div>
      <h2 style="font-size:24px">${q.q}</h2>
      <div class="options-grid">${q.opts.map((o, i) => `<div class="opt-btn" id="opt-${i}" onclick="checkAnswer(${i})"><div class="opt-idx">${labels[i]}</div><span>${o}</span></div>`).join('')}</div>
      <div id="quiz-feedback" class="ans-feedback"></div>
      <div style="margin-top:32px; display:flex; justify-content:flex-end"><button id="next-q-btn" class="badge primary" style="display:none; padding:12px 32px; cursor:pointer" onclick="nextQuestion()">Tiếp theo →</button></div>
    </div>`;
}

function checkAnswer(idx) {
  const q = quizPool[currentQIdx];
  if(document.getElementById('next-q-btn').style.display === 'block') return;
  const feedback = document.getElementById('quiz-feedback');
  const isCorrect = idx === q.ans;
  if(isCorrect) { quizScore++; document.getElementById(`opt-${idx}`).classList.add('correct'); feedback.innerHTML = `<strong>Chính xác!</strong><br>${q.exp}`; feedback.className = "ans-feedback show correct"; }
  else { document.getElementById(`opt-${idx}`).classList.add('wrong'); document.getElementById(`opt-${q.ans}`).classList.add('correct'); feedback.innerHTML = `<strong>Chưa đúng.</strong><br>${q.exp}`; feedback.className = "ans-feedback show wrong"; }
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('locked'));
  document.getElementById('next-q-btn').style.display = 'block';
}

function nextQuestion() {
  currentQIdx++;
  if(currentQIdx < quizPool.length) renderQuestion();
  else showQuizResult();
}

function showQuizResult() {
  const pct = Math.round((quizScore / quizPool.length) * 100);
  document.getElementById('quiz-area').innerHTML = `
    <div class="q-card" style="text-align:center">
      <div style="font-size:64px; margin-bottom:16px">${pct >= 80 ? '🎉' : '📖'}</div>
      <h2>Hoàn thành!</h2>
      <p style="font-size:48px; font-weight:800; color:var(--primary); margin:16px 0">${quizScore} / ${quizPool.length}</p>
      <p style="color:var(--text-sub)">Tỷ lệ chính xác: ${pct}%</p>
      <button class="badge primary" style="margin-top:32px; padding:12px 40px; cursor:pointer" onclick="location.reload()">Làm lại</button>
    </div>`;
  document.getElementById('quiz-prog').style.width = '100%';
}

init();
</script>
</body>
</html>
