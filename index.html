<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIT401 Pro - Nền tảng học IT Nhật Bản</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAFC;
    --card: #FFFFFF;
    --primary: #4F7CFF;
    --primary-hover: #3D6AEC;
    --primary-light: #EAF1FF;
    --success: #34C759;
    --warning: #FFB020;
    --error: #FF5A5F;
    --text-main: #222222;
    --text-sub: #666666;
    --border: #E8EAF0;
    --hover: #F4F7FF;
    --radius: 16px;
    --shadow: 0 4px 12px rgba(0,0,0,0.03);
    --sidebar-w: 260px;
    --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* --- LAYOUT --- */
  .app-container { display: flex; min-height: 100vh; }

  /* --- SIDEBAR --- */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--card);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 32px 0;
    display: flex;
    flex-direction: column;
    z-index: 100;
  }
  .logo-area { padding: 0 24px 40px; font-weight: 800; font-size: 22px; color: var(--primary); display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 36px; height: 36px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 20px; }

  .nav-section { padding: 0 12px; flex: 1; overflow-y: auto; }
  .nav-label { font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; padding: 0 12px 16px; opacity: 0.6; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius);
    color: var(--text-sub);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    margin-bottom: 4px;
  }
  .nav-item:hover { background: var(--hover); color: var(--primary); transform: translateX(4px); }
  .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; border-right: 3px solid var(--primary); border-radius: var(--radius) 0 0 var(--radius); }
  .ch-num-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.5; width: 24px; }

  /* --- MAIN CONTENT --- */
  .main-content { flex: 1; padding: 60px 48px; max-width: 1100px; margin: 0 auto; }
  .view-tab { display: none; animation: slideUp 400ms ease; }
  .view-tab.active { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* --- TOP NAV --- */
  .top-nav { display: flex; gap: 32px; margin-bottom: 48px; border-bottom: 2px solid var(--border); }
  .top-tab-btn { padding: 16px 4px; font-size: 15px; font-weight: 600; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; transition: var(--transition); position: relative; bottom: -2px; }
  .top-tab-btn:hover { color: var(--primary); }
  .top-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* --- CHAPTER HEADER --- */
  .ch-header { margin-bottom: 56px; }
  .ch-meta { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .badge { padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: var(--card); color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
  .badge.primary { background: var(--primary); color: white; border-color: var(--primary); }
  .badge.success { background: #E6F7ED; color: var(--success); border-color: #D0F0E4; }

  .ch-title-jp { font-size: 42px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
  .ch-title-vn { font-size: 24px; color: var(--text-sub); font-weight: 500; }

  /* --- KNOWLEDGE CARDS --- */
  .k-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: var(--transition);
  }
  .k-card:hover { border-color: var(--primary); box-shadow: 0 8px 24px rgba(79,124,255,0.08); }

  .k-card-head { padding: 24px 32px; cursor: pointer; display: flex; align-items: center; gap: 24px; user-select: none; }
  .k-icon-box { font-size: 24px; width: 56px; height: 56px; background: var(--bg); display: flex; align-items: center; justify-content: center; border-radius: 14px; transition: var(--transition); }
  .k-card:hover .k-icon-box { background: var(--primary-light); transform: scale(1.05); }

  .k-title-box { flex: 1; }
  .k-jp { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  .k-yomi { font-size: 13px; color: var(--primary); font-family: 'JetBrains Mono', monospace; font-weight: 500; background: var(--primary-light); padding: 2px 8px; border-radius: 6px; }
  .k-vn-term { display: block; font-size: 15px; color: var(--text-sub); margin-top: 4px; font-weight: 500; }

  .arrow { font-size: 14px; transition: 400ms cubic-bezier(0.4, 0, 0.2, 1); color: var(--text-sub); opacity: 0.4; }
  .k-card.open .arrow { transform: rotate(180deg); opacity: 1; }

  .k-card-body { display: none; padding: 0 32px 32px; border-top: 1px solid var(--border); background: #FCFCFD; }
  .k-card.open .k-card-body { display: block; }

  /* --- INFO BOXES --- */
  .card-section { margin-top: 24px; }
  .section-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #BBBECB; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content:''; flex: 1; height: 1px; background: var(--border); }

  .info-box { padding: 18px 20px; border-radius: 12px; margin-bottom: 16px; font-size: 15px; display: flex; gap: 16px; align-items: flex-start; transition: var(--transition); border: 1px solid transparent; }
  .info-box.blue { background: #F0F5FF; border-color: #D9E4FF; color: #3056D3; }
  .info-box.yellow { background: #FFF9E6; border-color: #FFEBB3; color: #855D00; }
  .info-box.green { background: #E6FFFA; border-color: #B2F5EA; color: #006B5F; }
  .info-box.gray { background: #F8F9FB; border-color: var(--border); color: var(--text-main); }

  .box-icon { font-size: 18px; margin-top: 2px; }

  /* --- QUIZ --- */
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 48px; box-shadow: 0 20px 40px rgba(0,0,0,0.04); }
  .q-count { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .q-text { font-size: 26px; font-weight: 700; margin-bottom: 40px; line-height: 1.4; }
  .opt-btn { background: var(--card); border: 2px solid var(--border); padding: 20px 28px; border-radius: 12px; cursor: pointer; font-size: 17px; font-weight: 600; transition: 150ms ease; display: flex; align-items: center; gap: 20px; margin-bottom: 12px; }
  .opt-btn:hover:not(.locked) { border-color: var(--primary); background: var(--hover); }
  .opt-btn.correct { background: #E6F7ED; border-color: var(--success); color: #0E733B; }
  .opt-btn.wrong { background: #FFF5F5; border-color: var(--error); color: #B3261E; }

  /* --- FLASHCARD --- */
  .flash-area { display: flex; justify-content: center; padding: 40px 0; }
  .flash-card { width: 400px; height: 300px; perspective: 1000px; cursor: pointer; }
  .flash-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; box-shadow: var(--shadow); border-radius: 24px; }
  .flash-card.flipped .flash-inner { transform: rotateY(180deg); }
  .flash-front, .flash-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 24px; border: 1px solid var(--border); background: white; padding: 40px; text-align: center; }
  .flash-back { transform: rotateY(180deg); background: var(--primary-light); }

  @media (max-width: 1024px) {
    .sidebar { width: 80px; }
    .logo-area span, .nav-item span:last-child, .nav-label { display: none; }
    .main-content { padding: 40px 24px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="logo-area"><div class="logo-icon">J</div><span>JIT401 Pro</span></div>
    <div class="nav-section"><div class="nav-label">Bài học</div><div id="sidebar-nav"></div></div>
  </aside>

  <main class="main-content">
    <div class="top-nav">
      <div id="tab-study" class="top-tab-btn active" onclick="switchMainTab('study')">📚 Bài học</div>
      <div id="tab-quiz" class="top-tab-btn" onclick="switchMainTab('quiz')">✏️ Luyện tập</div>
      <div id="tab-flashcard" class="top-tab-btn" onclick="switchMainTab('flashcard')">🎴 Flashcards</div>
    </div>

    <div id="view-study" class="view-tab active"><div id="lesson-content"></div></div>

    <div id="view-quiz" class="view-tab">
      <div class="quiz-container">
        <div class="progress-wrap"><div id="quiz-prog" class="progress-bar"></div></div>
        <div id="quiz-area"></div>
      </div>
    </div>

    <div id="view-flashcard" class="view-tab">
        <div class="flash-area" id="flash-area"></div>
        <div style="text-align:center;margin-top:40px">
            <button class="badge primary" style="cursor:pointer;padding:12px 24px" onclick="nextFlashcard()">Thẻ tiếp theo →</button>
        </div>
    </div>
  </main>
</div>

<script>
const chapters = [
  {
    num: 1, title: "コンピュータの基礎", vn: "Những kiến thức cơ bản về máy tính",
    vnSummary: "Giới thiệu tổng quan về lịch sử, nguyên lý hoạt động 'Ghi nhớ' và 'Xử lý' của máy tính, từ bàn tính cổ đại đến kiến trúc Von Neumann hiện đại.",
    concepts: [
      { term: "デジタルとアナログ", yomi: "でじたるとあなろぐ", vnTerm: "Digital và Analog", icon: "🔢",
        desc: "数値化された量(Digital)と連続的な量(Analog)の違い。",
        vnDesc: "Máy tính kỹ thuật số (digital) chuyển đổi các đại lượng vật lý liên tục (analog) thành 0 và 1.",
        rem: "電圧が高い(オン)を1，低い(オフ)を0に対応させて処理します。",
        vnRem: "Ghi nhớ: Digital là các bước nhảy rõ rệt, Analog là đường cong liên tục.",
        example: "Đồng hồ kim (Analog) vs Đồng hồ số (Digital).",
        tip: "Máy tính chỉ hiểu 0 và 1."
      },
      { term: "ノイマン型", yomi: "のいまんがた", vnTerm: "Kiến trúc Von Neumann", icon: "🧠",
        desc: "プログラムをデータと同様に記憶装置に格納する方式。",
        vnDesc: "Khái niệm lưu trữ chương trình độc lập với phần cứng, trở thành nền tảng máy tính hiện tại.",
        rem: "EDSAC (1949) はプログラム内蔵方式を採用した最初のコンピュータの一つです。",
        vnRem: "Tách biệt phần mềm và phần cứng giúp máy tính trở nên đa năng.",
        related: "ENIAC (1946) dùng chân không."
      }
    ],
    types: ["Máy tính đa năng: Siêu máy tính, Mainframe, Workstation, PC, Smartphone", "Máy tính chuyên dụng: Máy chơi game, Từ điển điện tử"]
  },
  {
    num: 2, title: "インターネット利用", vn: "Sử dụng internet",
    vnSummary: "Trình bày các hình thức sử dụng internet, đạo đức mạng (netiquette) và luật pháp về sở hữu trí tuệ.",
    concepts: [
      { term: "Web 2.0", yomi: "うぇぶにーてんぜろ", vnTerm: "Web 2.0", icon: "🌐",
        desc: "誰もが情報発信できる双方向メディア。2004年に提唱されました。",
        vnDesc: "Chuyển từ truyền thông một chiều sang hai chiều (Blog, SNS, Wiki, YouTube).",
        rem: "RSS, Ajax, トラックバックといった技術に支えられています。",
        vnRem: "Ajax giúp web mượt mà không cần load lại trang.",
        example: "Google Maps là ví dụ điển hình của công nghệ Ajax."
      },
      { term: "ロングテール", yomi: "ろんぐてーる", vnTerm: "Cái đuôi dài (Long Tail)", icon: "📉",
        desc: "多品種の商品を提供することで収入増をはかるビジネスモデル。",
        vnDesc: "Chú trọng số lượng đa dạng các sản phẩm ngách thay vì chỉ tập trung sản phẩm bán chạy.",
        rem: "在庫制約のないネットショップ（Amazonなど）で有効です。",
        vnRem: "Bán 80% sản phẩm kén khách vẫn mang lại tiền nhờ số lượng mẫu mã lớn.",
        tip: "Ngược lại với quy luật 80/20 truyền thống."
      }
    ],
    types: ["Pháp luật: Quyền tác giả (Bản quyền) vs Quyền sở hữu công nghiệp (Sáng chế...)", "OECD 8 nguyên tắc bảo vệ thông tin cá nhân"]
  },
  {
    num: 6, title: "インターネット技術", vn: "Công nghệ internet",
    vnSummary: "Giải thích các công nghệ cốt lõi cấu thành nên hệ thống internet như OSI, IP và HTML.",
    concepts: [
      { term: "OSI 7層モデル", yomi: "OSI 7そうもでる", vnTerm: "Mô hình OSI 7 lớp", icon: "🪜",
        desc: "通信機能を7つの階層で定義した国際標準モデル。",
        vnDesc: "Quy ước tiêu chuẩn quốc tế giúp các thiết bị khác hãng có thể giao tiếp.",
        rem: "HTTP (7層), TCP (4層), IP (3層) の位置づけが重要です。",
        vnRem: "Ghi nhớ: HTTP ở tầng Ứng dụng, TCP ở tầng Giao vận, IP ở tầng Mạng.",
        tip: "Lớp dưới phục vụ lớp trên."
      }
    ],
    types: ["Địa chỉ: IPv4 (32 bit) vs IPv6 (128 bit)", "Luồng tin: Chuyền tay thùng nước (Bucket Relay)"]
  }
];

// Thêm stub cho các chương khác
for(let i=1; i<=16; i++) {
    if(!chapters.find(c => c.num === i)) chapters.push({ num: i, title: `Chương ${i}`, vn: "Nội dung đang đồng bộ", concepts: [], types: [] });
}
chapters.sort((a,b) => a.num - b.num);

const allQuestions = [
  { ch:1, q:"Máy tính hoạt động dựa trên 2 chức năng cốt lõi nào?", opts:["Nhập và Xuất","Ghi nhớ và Xử lý","Bật và Tắt","Lướt web và Chơi game"], ans:1, exp:"Mọi máy tính đều phải có khả năng Ghi nhớ dữ liệu và Xử lý dữ liệu đó." },
  { ch:2, q:"Công nghệ nào giúp Google Maps chạy mượt mà không cần load lại cả trang?", opts:["RSS","Ajax","Trackback","HTML5"], ans:1, exp:"Ajax cho phép cập nhật từng phần của trang web bằng cách gửi yêu cầu ngầm tới server." }
];

let curCh = 1;
let curFlashIdx = 0;

function init() {
  const nav = document.getElementById('sidebar-nav');
  chapters.forEach(ch => {
    const item = document.createElement('div');
    item.className = `nav-item ${ch.num === 1 ? 'active' : ''}`;
    item.id = `nav-ch-${ch.num}`;
    item.onclick = () => renderChapter(ch.num);
    item.innerHTML = `<span class="ch-num-badge">${String(ch.num).padStart(2,'0')}</span> <span>${ch.title}</span>`;
    nav.appendChild(item);
  });
  renderChapter(1);
}

function switchMainTab(tab) {
  document.querySelectorAll('.view-tab').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`view-${tab}`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if(tab === 'flashcard') renderFlashcard();
  if(tab === 'quiz' && quizPool.length === 0) resetQuizUI();
}

function renderChapter(num) {
  curCh = num;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.getElementById(`nav-ch-${num}`).classList.add('active');
  const ch = chapters.find(c => c.num === num);
  const content = document.getElementById('lesson-content');

  const cards = ch.concepts.map((con, idx) => `
    <div class="k-card" id="k-card-${idx}">
      <div class="k-card-head" onclick="toggleCard(${idx})">
        <div class="k-icon-box">${con.icon}</div>
        <div class="k-title-box">
          <div class="k-jp">${con.term} <span class="k-yomi">${con.yomi}</span></div>
          <span class="k-vn-term">${con.vnTerm}</span>
        </div>
        <div class="arrow">▼</div>
      </div>
      <div class="k-card-body">
        <div class="card-section">
            <div class="section-label">📖 Khái niệm</div>
            <div class="info-box blue"><div><p><strong>${con.desc}</strong></p><p>${con.vnDesc}</p></div></div>
        </div>
        <div class="card-section">
            <div class="section-label">💡 Ghi nhớ</div>
            <div class="info-box gray"><div><p>${con.rem}</p><p><em>${con.vnRem}</em></p></div></div>
        </div>
        ${con.example ? `<div class="card-section"><div class="section-label">📝 Ví dụ</div><div class="info-box gray"><p>${con.example}</p></div></div>` : ''}
        ${con.tip ? `<div class="card-section"><div class="section-label">🎯 Mẹo học</div><div class="info-box green"><p>${con.tip}</p></div></div>` : ''}
      </div>
    </div>
  `).join('');

  content.innerHTML = `
    <div class="ch-header">
      <div class="ch-meta"><div class="badge primary">Chapter ${ch.num}</div></div>
      <h1 class="ch-title-jp">${ch.title}</h1>
      <div class="ch-title-vn">${ch.vn}</div>
    </div>
    <div class="info-box" style="background:var(--primary-light);border:none;padding:24px;border-radius:20px">
        <p style="color:var(--primary);font-weight:600"><strong>Tóm tắt:</strong> ${ch.vnSummary}</p>
    </div>
    <div class="nav-label" style="padding-left:0">Kiến thức trọng tâm</div>
    ${cards}
  `;
  switchMainTab('study');
}

function toggleCard(i) { document.getElementById(`k-card-${i}`).classList.toggle('open'); }

function renderFlashcard() {
    const ch = chapters.find(c => c.num === curCh);
    const area = document.getElementById('flash-area');
    if(!ch.concepts.length) { area.innerHTML = "<p>Chương này chưa có Flashcard.</p>"; return; }
    const con = ch.concepts[curFlashIdx % ch.concepts.length];
    area.innerHTML = `
        <div class="flash-card" onclick="this.classList.toggle('flipped')">
            <div class="flash-inner">
                <div class="flash-front">
                    <div style="font-size:14px;color:var(--primary);margin-bottom:10px">${con.yomi}</div>
                    <div style="font-size:32px;font-weight:800">${con.term}</div>
                    <div style="margin-top:20px;font-size:12px;opacity:0.5">Click để xem nghĩa</div>
                </div>
                <div class="flash-back">
                    <div style="font-size:24px;font-weight:700;color:var(--primary)">${con.vnTerm}</div>
                    <div style="margin-top:16px;font-size:15px">${con.vnDesc}</div>
                </div>
            </div>
        </div>
    `;
}
function nextFlashcard() { curFlashIdx++; renderFlashcard(); }

function resetQuizUI() {
    document.getElementById('quiz-area').innerHTML = `
        <div class="q-card" style="text-align:center">
            <h2 style="margin-bottom:20px">Sẵn sàng ôn tập Chương ${curCh}?</h2>
            <button class="badge primary" style="padding:16px 32px;cursor:pointer;margin:0 auto" onclick="startQuiz()">Bắt đầu Quiz</button>
        </div>
    `;
}

function startQuiz() {
    quizPool = allQuestions.filter(q => q.ch === curCh);
    if(!quizPool.length) { alert("Chương này chưa có câu hỏi trắc nghiệm."); return; }
    currentQIdx = 0; score = 0;
    renderQuestion();
}

function renderQuestion() {
    const q = quizPool[currentQIdx];
    const area = document.getElementById('quiz-area');
    document.getElementById('quiz-prog').style.width = `${(currentQIdx / quizPool.length) * 100}%`;
    const labels = ['A','B','C','D'];
    area.innerHTML = `
        <div class="q-card">
            <div class="q-count">Câu ${currentQIdx+1}/${quizPool.length}</div>
            <div class="q-text">${q.q}</div>
            <div id="opts-list">${q.opts.map((o,i) => `<div class="opt-btn" onclick="checkAns(${i})"><div style="width:30px;font-weight:800;opacity:0.4">${labels[i]}</div>${o}</div>`).join('')}</div>
            <div id="quiz-fb" class="ans-feedback"></div>
            <button id="next-btn" class="badge primary" style="display:none;margin:32px auto 0;cursor:pointer" onclick="nextQ()">Tiếp theo</button>
        </div>
    `;
}

function checkAns(idx) {
    const q = quizPool[currentQIdx];
    const fb = document.getElementById('quiz-fb');
    const btns = document.querySelectorAll('.opt-btn');
    if(btns[0].classList.contains('locked')) return;
    const correct = idx === q.ans;
    if(correct) score++;
    btns[idx].classList.add(correct ? 'correct' : 'wrong');
    btns[q.ans].classList.add('correct');
    btns.forEach(b => b.classList.add('locked'));
    fb.innerHTML = `<strong>${correct ? 'Chính xác!' : 'Chưa đúng.'}</strong><p>${q.exp}</p>`;
    fb.className = `ans-feedback show ${correct ? 'correct' : 'wrong'}`;
    document.getElementById('next-btn').style.display = 'block';
}

function nextQ() {
    currentQIdx++;
    if(currentQIdx < quizPool.length) renderQuestion();
    else {
        document.getElementById('quiz-prog').style.width = '100%';
        document.getElementById('quiz-area').innerHTML = `<div class="q-card" style="text-align:center"><h2>Hoàn thành!</h2><p style="font-size:48px;font-weight:800;color:var(--primary);margin:20px 0">${score}/${quizPool.length}</p><button class="badge primary" style="cursor:pointer;margin:0 auto" onclick="resetQuizUI()">Làm lại</button></div>`;
    }
}

init();
</script>
</body>
</html>
