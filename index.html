<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIT401 — Ôn thi IT Nhật Bản</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F7FB;
      --card: #FFFFFF;
      --primary: #4361EE;
      --primary-hover: #3451D1;
      --primary-light: #EEF1FD;
      --accent: #F72585;
      --accent-light: #FEE8F3;
      --success: #2DC653;
      --success-light: #E6F9EC;
      --warning: #F7B731;
      --warning-light: #FEF9E7;
      --error: #EF233C;
      --error-light: #FEE8EB;
      --text: #1A1D2E;
      --text-sub: #6B7280;
      --text-muted: #9CA3AF;
      --border: #E5E8F0;
      --hover: #F0F3FF;
      --sidebar-w: 280px;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 2px 12px rgba(67,97,238,0.07);
      --shadow-md: 0 8px 32px rgba(67,97,238,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
      font-size: 15px;
    }

    /* ── LAYOUT ── */
    .app { display: flex; min-height: 100vh; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--card);
      border-right: 1.5px solid var(--border);
      position: fixed; top: 0; left: 0; bottom: 0;
      display: flex; flex-direction: column;
      z-index: 200; overflow: hidden;
    }
    .sidebar-logo {
      padding: 28px 24px 20px;
      display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), #7B2FBE);
      color: #fff; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }
    .logo-text { font-weight: 900; font-size: 18px; color: var(--text); }
    .logo-sub { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-top: 1px; }

    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 16px 12px 24px; }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .nav-group-label {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--text-muted);
      padding: 8px 12px 10px; margin-top: 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      cursor: pointer; transition: all 180ms ease;
      margin-bottom: 2px; color: var(--text-sub);
      font-size: 13.5px; font-weight: 500;
    }
    .nav-item:hover { background: var(--hover); color: var(--primary); }
    .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 700; }
    .nav-item .ch-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--text-muted);
      width: 22px; flex-shrink: 0; font-weight: 500;
    }
    .nav-item.active .ch-num { color: var(--primary); opacity: 0.6; }
    .nav-star { font-size: 10px; opacity: 0.7; flex-shrink: 0; }

    /* ── MAIN ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1; display: flex; flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      background: var(--card);
      border-bottom: 1.5px solid var(--border);
      padding: 0 40px;
      display: flex; align-items: center; gap: 0;
      position: sticky; top: 0; z-index: 100;
      height: 56px; flex-shrink: 0;
    }
    .tab-btn {
      padding: 0 20px; height: 56px;
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; color: var(--text-sub);
      cursor: pointer; border-bottom: 2.5px solid transparent;
      transition: all 160ms ease; white-space: nowrap;
    }
    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-icon { font-size: 16px; }

    .content { flex: 1; padding: 40px; max-width: 860px; margin: 0 auto; width: 100%; }

    /* ── VIEWS ── */
    .view { display: none; }
    .view.active { display: block; animation: fadeUp 320ms ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    /* ── CHAPTER HEADER ── */
    .ch-header { margin-bottom: 36px; }
    .ch-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .badge {
      padding: 4px 12px; border-radius: 99px;
      font-size: 12px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .badge-num { background: var(--primary); color: #fff; }
    .badge-star { background: var(--warning-light); color: #B07500; }
    .badge-vn { background: var(--success-light); color: #1A7A38; }
    .ch-jp { font-size: 36px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px; line-height: 1.2; font-family: 'Noto Sans JP', 'Inter', sans-serif; }
    .ch-vn { font-size: 20px; color: var(--text-sub); font-weight: 600; margin-bottom: 20px; }
    .ch-summary {
      background: var(--primary-light); border-radius: var(--radius);
      padding: 18px 22px; font-size: 14px; color: #334;
      border-left: 4px solid var(--primary); line-height: 1.7;
    }

    /* ── KNOWLEDGE CARDS ── */
    .section-divider {
      font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--text-muted);
      margin: 28px 0 14px; display: flex; align-items: center; gap: 10px;
    }
    .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .k-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); margin-bottom: 14px;
      box-shadow: var(--shadow); overflow: hidden;
      transition: border-color 200ms, box-shadow 200ms;
    }
    .k-card:hover { border-color: #C5D0FF; box-shadow: var(--shadow-md); }
    .k-card-head {
      padding: 20px 24px; cursor: pointer;
      display: flex; align-items: center; gap: 18px;
      user-select: none;
    }
    .k-icon { font-size: 26px; width: 50px; height: 50px; background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 200ms; }
    .k-card.open .k-icon { background: var(--primary-light); }
    .k-labels { flex: 1; min-width: 0; }
    .k-jp-term { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: 'Noto Sans JP', sans-serif; }
    .k-yomi { font-size: 11.5px; color: var(--primary); font-family: 'JetBrains Mono', monospace; font-weight: 600; background: var(--primary-light); padding: 2px 8px; border-radius: 5px; }
    .k-vn-sub { font-size: 13.5px; color: var(--text-sub); font-weight: 500; margin-top: 3px; }
    .k-arrow { font-size: 11px; color: var(--text-muted); transition: transform 300ms ease; flex-shrink: 0; }
    .k-card.open .k-arrow { transform: rotate(180deg); }

    .k-card-body { display: none; padding: 0 24px 24px; border-top: 1px solid var(--border); background: #FAFBFF; }
    .k-card.open .k-card-body { display: block; }

    .info-row { margin-top: 18px; }
    .info-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .info-box {
      padding: 14px 18px; border-radius: var(--radius-sm);
      font-size: 14px; line-height: 1.7; border: 1px solid transparent;
    }
    .info-box p + p { margin-top: 6px; }
    .info-blue { background: #F0F4FF; border-color: #C8D5FF; color: #233580; }
    .info-gray { background: var(--bg); border-color: var(--border); color: var(--text); }
    .info-green { background: var(--success-light); border-color: #B7EFC9; color: #145E27; }
    .info-yellow { background: var(--warning-light); border-color: #FDDFA0; color: #7A5000; }
    .info-accent { background: var(--accent-light); border-color: #FFBFE6; color: #8A0048; }

    /* ── TRANSLATION TABLE ── */
    .trans-table-wrap { overflow-x: auto; margin-top: 12px; }
    .trans-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .trans-table th { background: var(--primary); color: #fff; padding: 10px 14px; text-align: left; font-weight: 700; font-size: 12px; letter-spacing: 0.5px; }
    .trans-table th:first-child { border-radius: var(--radius-sm) 0 0 0; }
    .trans-table th:last-child { border-radius: 0 var(--radius-sm) 0 0; }
    .trans-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .trans-table tr:last-child td { border-bottom: none; }
    .trans-table tr:nth-child(even) td { background: #FAFBFF; }
    .trans-table .jp-cell { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; color: var(--text); }
    .trans-table .kw-cell { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--primary); background: var(--primary-light); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
    .trans-table .vn-cell { color: var(--text-sub); }
    .trans-table .note-cell { font-size: 12px; color: var(--text-muted); font-style: italic; }

    /* ── QUIZ ── */
    .quiz-wrap { max-width: 680px; margin: 0 auto; }
    .quiz-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 44px; box-shadow: var(--shadow-md); }
    .q-meta { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .q-text { font-size: 22px; font-weight: 800; line-height: 1.45; margin-bottom: 10px; }
    .q-jp { font-size: 14px; color: var(--text-muted); font-family: 'Noto Sans JP', sans-serif; margin-bottom: 32px; }
    .opts-list { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn {
      background: var(--card); border: 2px solid var(--border);
      padding: 16px 20px; border-radius: 10px;
      cursor: pointer; font-size: 15.5px; font-weight: 600;
      text-align: left; transition: all 140ms ease;
      display: flex; align-items: center; gap: 16px;
      color: var(--text);
    }
    .opt-btn:hover:not(.locked) { border-color: var(--primary); background: var(--hover); }
    .opt-btn .opt-label { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--text-muted); flex-shrink: 0; transition: 140ms; }
    .opt-btn.correct { background: var(--success-light); border-color: var(--success); color: #0C5E20; }
    .opt-btn.correct .opt-label { background: var(--success); border-color: var(--success); color: #fff; }
    .opt-btn.wrong { background: var(--error-light); border-color: var(--error); color: #8B0016; }
    .opt-btn.wrong .opt-label { background: var(--error); border-color: var(--error); color: #fff; }
    .quiz-feedback { margin-top: 20px; padding: 16px 20px; border-radius: 10px; font-size: 14px; display: none; }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.correct { background: var(--success-light); border: 1px solid #B7EFC9; color: #145E27; }
    .quiz-feedback.wrong { background: var(--error-light); border: 1px solid #FFBCBE; color: #8B0016; }
    .quiz-feedback strong { font-size: 15px; display: block; margin-bottom: 6px; }
    .progress-bar-wrap { height: 5px; background: var(--border); border-radius: 99px; margin-bottom: 28px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 99px; transition: width 400ms ease; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--primary); color: #fff;
      padding: 12px 24px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 700; cursor: pointer;
      border: none; transition: 160ms; margin-top: 24px;
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-outline {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: var(--primary);
      padding: 12px 24px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 700; cursor: pointer;
      border: 2px solid var(--primary); transition: 160ms; margin-top: 24px; margin-left: 10px;
    }
    .btn-outline:hover { background: var(--primary-light); }

    .quiz-score-card { text-align: center; }
    .score-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--primary-light); border: 4px solid var(--primary); display: flex; align-items: center; justify-content: center; flex-direction: column; margin: 20px auto; }
    .score-num { font-size: 38px; font-weight: 900; color: var(--primary); line-height: 1; }
    .score-denom { font-size: 13px; color: var(--text-sub); font-weight: 600; }

    /* ── FLASHCARD ── */
    .flash-wrap { max-width: 560px; margin: 0 auto; padding: 20px 0 40px; }
    .flash-controls { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 30px; }
    .flash-counter { font-size: 14px; font-weight: 700; color: var(--text-sub); }
    .flash-scene { width: 100%; height: 300px; perspective: 1000px; cursor: pointer; margin-bottom: 24px; }
    .flash-inner { position: relative; width: 100%; height: 100%; transition: transform 0.55s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }
    .flash-scene.flipped .flash-inner { transform: rotateY(180deg); }
    .flash-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 36px; text-align: center; box-shadow: var(--shadow-md);
    }
    .flash-back-face { transform: rotateY(180deg); background: var(--primary-light); border-color: #C5D0FF; }
    .flash-hint { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 700; }
    .flash-jp { font-size: 30px; font-weight: 900; font-family: 'Noto Sans JP', sans-serif; margin-bottom: 8px; }
    .flash-yomi { font-size: 13px; color: var(--primary); font-family: 'JetBrains Mono', monospace; font-weight: 600; background: var(--primary); color: #fff; padding: 3px 10px; border-radius: 6px; margin-bottom: 0; }
    .flash-vn-term { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .flash-vn-desc { font-size: 14px; color: var(--text-sub); line-height: 1.6; }
    .flash-btns { display: flex; gap: 10px; justify-content: center; }
    .flash-btn { padding: 10px 22px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: var(--card); font-size: 14px; font-weight: 700; cursor: pointer; transition: 150ms; color: var(--text); }
    .flash-btn:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .flash-btn.next { background: var(--primary); color: #fff; border-color: var(--primary); }
    .flash-btn.next:hover { background: var(--primary-hover); }

    /* ── START / EMPTY ── */
    .start-card { text-align: center; padding: 60px 32px; background: var(--card); border-radius: 20px; border: 1.5px solid var(--border); box-shadow: var(--shadow); }
    .start-icon { font-size: 56px; margin-bottom: 16px; }
    .start-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    .start-sub { font-size: 15px; color: var(--text-sub); }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      :root { --sidebar-w: 0px; }
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .content { padding: 24px 16px; }
      .ch-jp { font-size: 26px; }
      .quiz-card { padding: 24px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">J</div>
      <div>
        <div class="logo-text">JIT401</div>
        <div class="logo-sub">Ôn thi IT Nhật Bản</div>
      </div>
    </div>
    <div class="sidebar-scroll">
      <div class="nav-group-label">16 Chương</div>
      <div id="sidebar-nav"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="tab-btn active" id="tab-study" onclick="switchTab('study')"><span class="tab-icon">📚</span> Bài học</div>
      <div class="tab-btn" id="tab-table" onclick="switchTab('table')"><span class="tab-icon">📋</span> Bảng từ vựng</div>
      <div class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')"><span class="tab-icon">✏️</span> Luyện tập</div>
      <div class="tab-btn" id="tab-flash" onclick="switchTab('flash')"><span class="tab-icon">🎴</span> Flashcard</div>
    </div>

    <div class="content">
      <div id="view-study" class="view active"></div>
      <div id="view-table" class="view"></div>
      <div id="view-quiz" class="view"></div>
      <div id="view-flash" class="view"></div>
    </div>
  </div>
</div>

<script>
  /* ────────────────────────────────────────
     DATA — ALL 16 CHAPTERS
  ──────────────────────────────────────── */
  const DATA = [

        ["パス", "ぱす", "Path (đường dẫn)", "Vị trí file trong thư mục"],
      ],

  /* ── INIT ── */
  function init() {
    buildSidebar();
    renderStudy(currentCh);
    renderTable(currentCh);
    renderQuizStart();
    renderFlashStart();
  }

  function buildSidebar() {
    const nav = document.getElementById('sidebar-nav');
    DATA.forEach(ch => {
      const el = document.createElement('div');
      el.className = 'nav-item' + (ch.num === currentCh ? ' active' : '');
      el.id = `nav-${ch.num}`;
      el.onclick = () => selectChapter(ch.num);
      const stars = ch.stars === 5 ? '⭐⭐⭐⭐⭐' : ch.stars === 4 ? '⭐⭐⭐⭐' : '⭐⭐⭐';
      el.innerHTML = `
        <span class="ch-num">${String(ch.num).padStart(2,'0')}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ch.title.split('（')[0].split('・')[0]}</span>
        <span class="nav-star">${stars}</span>
      `;
      nav.appendChild(el);
    });
  }

  function selectChapter(num) {
    currentCh = num;
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.getElementById(`nav-${num}`).classList.add('active');
    renderStudy(num);
    renderTable(num);
    renderQuizStart();
    renderFlashStart();
    if (currentTab !== 'study') switchTab('study');
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`view-${tab}`).classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');
  }

      <div class="section-divider">Khái niệm trọng tâm (${ch.concepts.length} mục)</div>
      ${cards}
      <div style="height:40px"></div>
    `;
  }

  function toggleCard(i) {
    document.getElementById(`kc-${i}`).classList.toggle('open');
  }

  /* ── TABLE VIEW ── */
  function renderTable(num) {
    const ch = DATA.find(c => c.num === num);
    const rows = ch.vocab.map(([jp, yomi, vn, note]) => `
      <tr>
        <td class="jp-cell">${jp}</td>
        <td><span class="kw-cell">${yomi}</span></td>
        <td class="vn-cell">${vn}</td>
        <td class="note-cell">${note}</td>
      </tr>
    `).join('');

    document.getElementById('view-table').innerHTML = `
      <div class="ch-header" style="margin-bottom:20px">
        <h1 class="ch-jp" style="font-size:28px">${ch.title}</h1>
        <div class="ch-vn" style="font-size:16px">${ch.vn} — Bảng từ vựng (${ch.vocab.length} từ)</div>
      </div>
      <div class="trans-table-wrap">
        <table class="trans-table">
          <thead>
            <tr>
              <th>🇯🇵 Tiếng Nhật</th>
              <th>Phiên âm</th>
              <th>🇻🇳 Tiếng Việt</th>
              <th>Ghi chú</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  /* ── QUIZ VIEW ── */
  function renderQuizStart() {
    const ch = DATA.find(c => c.num === currentCh);
    document.getElementById('view-quiz').innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-card quiz-score-card">
          <div style="font-size:48px;margin-bottom:16px">✏️</div>
          <h2 style="font-size:22px;font-weight:800;margin-bottom:10px">Luyện tập Chương ${ch.num}</h2>
          <p style="color:var(--text-sub);margin-bottom:28px">${ch.vn}<br><strong>${ch.quizzes.length} câu hỏi</strong> trắc nghiệm</p>
          <button class="btn-primary" onclick="startQuiz()">Bắt đầu Quiz →</button>
        </div>
      </div>
    `;
    quizState = { pool: [...DATA.find(c => c.num === currentCh).quizzes], idx: 0, score: 0 };
  }

  function startQuiz() {
    quizState.idx = 0;
    quizState.score = 0;
    renderQuestion();
  }

  function renderQuestion() {
    const { pool, idx } = quizState;
    if (idx >= pool.length) { renderQuizResult(); return; }
    const q = pool[idx];
    const labels = ['A','B','C','D'];
    const prog = Math.round((idx / pool.length) * 100);
    document.getElementById('view-quiz').innerHTML = `
      <div class="quiz-wrap">
        <div class="progress-bar-wrap"><div class="progress-bar" style="width:${prog}%"></div></div>
        <div class="quiz-card">
          <div class="q-meta">Câu ${idx+1} / ${pool.length}</div>
          <div class="q-text">${q.q}</div>
          ${q.jp ? `<div class="q-jp">🇯🇵 ${q.jp}</div>` : '<div style="height:12px"></div>'}
          <div class="opts-list">
            ${q.opts.map((o,i) => `
              <button class="opt-btn" id="opt-${i}" onclick="checkAnswer(${i})">
                <span class="opt-label">${labels[i]}</span>
                ${o}
              </button>
            `).join('')}
          </div>
          <div class="quiz-feedback" id="quiz-fb"></div>
          <div id="quiz-next" style="display:none">
            <button class="btn-primary" onclick="nextQuestion()">Câu tiếp theo →</button>
          </div>
        </div>
      </div>
    `;
  }

  function checkAnswer(idx) {
    const q = quizState.pool[quizState.idx];
    const btns = document.querySelectorAll('.opt-btn');
    if ([...btns].some(b => b.classList.contains('correct') || b.classList.contains('wrong'))) return;
    const correct = idx === q.ans;
    if (correct) quizState.score++;
    btns[idx].classList.add(correct ? 'correct' : 'wrong');
    btns[q.ans].classList.add('correct');
    btns.forEach(b => b.classList.add('locked'));
    const fb = document.getElementById('quiz-fb');
    fb.innerHTML = `<strong>${correct ? '✅ Chính xác!' : '❌ Chưa đúng.'}</strong> ${q.exp}`;
    fb.className = `quiz-feedback show ${correct ? 'correct' : 'wrong'}`;
    document.getElementById('quiz-next').style.display = 'block';
  }

  function nextQuestion() {
    quizState.idx++;
    renderQuestion();
  }

  function renderQuizResult() {
    const { pool, score } = quizState;
    const pct = Math.round((score / pool.length) * 100);
    const msg = pct >= 80 ? '🎉 Xuất sắc! Bạn đã nắm vững chương này!' : pct >= 60 ? '👍 Tốt! Ôn thêm một chút nữa nhé.' : '📚 Cần ôn tập thêm. Thử lại đi!';
    document.getElementById('view-quiz').innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-card quiz-score-card">
          <h2 style="font-size:22px;font-weight:800;margin-bottom:20px">Kết quả</h2>
          <div class="score-circle">
            <div class="score-num">${score}</div>
            <div class="score-denom">/ ${pool.length}</div>
          </div>
          <p style="font-size:15px;color:var(--text-sub);margin:16px 0 8px">${pct}% chính xác</p>
          <p style="font-size:16px;font-weight:700;color:var(--text)">${msg}</p>
          <div>
            <button class="btn-primary" onclick="startQuiz()">Làm lại</button>
            <button class="btn-outline" onclick="renderQuizStart()">Về trang đầu</button>
          </div>
        </div>
      </div>
    `;
  }

  /* ── FLASHCARD VIEW ── */
  function renderFlashStart() {
    flashState.idx = 0;
    renderFlash();
  }

  function renderFlash() {
    const ch = DATA.find(c => c.num === currentCh);
    if (!ch.concepts.length) {
      document.getElementById('view-flash').innerHTML = `<div class="start-card"><div class="start-icon">🎴</div><div class="start-title">Chưa có Flashcard</div></div>`;
      return;
    }
    const idx = flashState.idx % ch.concepts.length;
    const con = ch.concepts[idx];
    document.getElementById('view-flash').innerHTML = `
      <div class="flash-wrap">
        <div class="flash-controls">
          <span class="flash-counter">${idx+1} / ${ch.concepts.length}</span>
        </div>
        <div class="flash-scene" id="flash-scene" onclick="this.classList.toggle('flipped')">
          <div class="flash-inner">
            <div class="flash-face">
              <div class="flash-hint">🇯🇵 Click để xem nghĩa</div>
              <div class="flash-jp">${con.term}</div>
              <div style="margin-top:10px"><span class="flash-yomi">${con.yomi}</span></div>
            </div>
            <div class="flash-face flash-back-face">
              <div class="flash-hint">🇻🇳 Nghĩa tiếng Việt</div>
              <div class="flash-vn-term">${con.vnTerm}</div>
              <div class="flash-vn-desc">${con.vn ? con.vn.split('.')[0] : ''}</div>
            </div>
          </div>
        </div>
        <div class="flash-btns">
          <button class="flash-btn" onclick="prevFlash()">← Trước</button>
          <button class="flash-btn next" onclick="nextFlash()">Tiếp theo →</button>
        </div>
      </div>
    `;
  }

  function nextFlash() { flashState.idx++; renderFlash(); }
  function prevFlash() { flashState.idx = Math.max(0, flashState.idx - 1); renderFlash(); }

  init();
</script>
</body>
</html>
